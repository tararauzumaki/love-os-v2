<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kiss Day: Kiss Quest</title>
    
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka+One&display=swap" rel="stylesheet">

    <script src="lib/gsap.min.js"></script>
    <script src="lib/howler.min.js"></script>
    <script src="lib/confetti.browser.min.js"></script>

    <style>
        body {
            margin: 0; padding: 0; overflow: hidden;
            background: #ffdde1;
            font-family: 'Press Start 2P', cursive;
            touch-action: none; user-select: none;
            display: flex; justify-content: center; align-items: center;
        }

        /* --- CONTAINER --- */
        #main-container {
            position: relative; width: 100vw; height: 100vh;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        /* ================= PART 1: THE FACE ================= */
        #part1-face {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10;
            background: radial-gradient(circle, #fff 0%, #ffdde1 100%);
        }

        #face-wrapper {
            position: relative;
            width: 300px; height: 300px; 
        }

        #cartoon-face {
            width: 100%; height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.2));
        }

        /* Hitboxes */
        .hitbox { position: absolute; cursor: pointer; }
        #hit-nose { top: 45%; left: 40%; width: 20%; height: 20%; border-radius: 50%; }
        #hit-cheek-l { top: 50%; left: 10%; width: 25%; height: 25%; border-radius: 50%; }
        #hit-cheek-r { top: 50%; right: 10%; width: 25%; height: 25%; border-radius: 50%; }

        .kiss-mark {
            position: absolute; width: 50px; height: 50px; pointer-events: none;
            background-image: url('assets/d7_kiss_mark.png');
            background-size: contain; background-repeat: no-repeat; opacity: 0;
        }

        #counter { margin-top: 20px; color: #e84393; font-size: 1.2rem; }

        /* ================= PART 2: THE GAME ================= */
        #part2-game {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            /* UPDATED: Cheerful Candy Gradient Background */
            background: linear-gradient(180deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            z-index: 20;
        }
        
        canvas { display: block; width: 100%; height: 100%; }

        #game-ui {
            position: absolute; top: 20px; left: 20px;
            color: #d63031; /* Changed text color to pop against pink bg */
            text-shadow: 2px 2px 0 #fff; /* White outline */
            font-size: 1.2rem;
        }

        /* --- LEVEL 2 INTRO --- */
        #level2-intro {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(45, 52, 54, 0.95);
            z-index: 30;
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center; color: white;
        }

        .retro-btn {
            background: #e84393; color: white; border: 4px solid white;
            padding: 20px 30px; font-family: 'Press Start 2P'; font-size: 1rem;
            cursor: pointer; margin-top: 30px; box-shadow: 6px 6px 0 #000;
        }
        .retro-btn:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0 #000; }

        /* ================= PART 3: REWARD ================= */
        #reward-screen {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 50;
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center;
        }

        #photo-frame {
            background: white; padding: 15px 15px 50px 15px;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
            transform: rotate(-3deg); margin-bottom: 20px;
        }
        
        #photo-frame img {
            max-width: 80vw; max-height: 50vh; border: 1px solid #ddd;
        }
    </style>
</head>
<body>

    <div id="main-container">

        <div id="part1-face">
            <h1 style="color:#e84393; font-size:1rem; margin-bottom:20px; text-align:center; line-height:1.5;">GIVE ME 7 KISSES!</h1>
            
            <div id="face-wrapper">
                <img id="cartoon-face" src="assets/d7_face_cartoon.png" alt="My Face">
                <div id="hit-nose" class="hitbox" onclick="honkNose()"></div>
                <div id="hit-cheek-l" class="hitbox" onclick="giveKiss(event)"></div>
                <div id="hit-cheek-r" class="hitbox" onclick="giveKiss(event)"></div>
            </div>

            <div id="counter">Kisses: <span id="kiss-count">0</span>/7</div>
            <p style="margin-top:10px; font-size:0.6rem; color:#636e72;">(Tap Cheeks to Kiss)</p>
        </div>

        <div id="level2-intro">
            <h1 style="color:#fd79a8; margin-bottom: 20px;">LEVEL 2 UNLOCKED!</h1>
            <p style="line-height: 1.8; font-size: 0.8rem; max-width: 80%;">
                Dodge the Enemies:<br>
                (Laundry, Alarm, Slow Wifi)<br><br>
                Catch 10 Hearts ❤️
            </p>
            <button class="retro-btn" onclick="startLevel2()">START GAME</button>
        </div>

        <div id="part2-game">
            <div id="game-ui">HEARTS: <span id="score">0</span>/10</div>
            <canvas id="gameCanvas"></canvas>
        </div>

        <div id="reward-screen">
            <h1 style="color:#ffd700; margin-bottom:20px;">WINNER!</h1>
            <div id="photo-frame">
                <img src="assets/d7_reward.png" alt="Us">
                <div style="color:#333; font-family:'Fredoka One', sans-serif; font-size:1.5rem; margin-top:10px;">Our Real Kiss ❤️</div>
            </div>
            <button class="retro-btn" onclick="location.href='index.html'">SAVE MEMORY</button>
        </div>

    </div>

    <script>
        // --- ASSETS ---
        let bgmGame, sfxKiss, sfxHonk, sfxWin, sfxHit;
        try {
            bgmGame = new Howl({ src: ['assets/bgm_game.mp3'], loop: true, volume: 0.4 });
            sfxKiss = new Howl({ src: ['assets/sfx_kiss.mp3'], volume: 0.8 });
            sfxHonk = new Howl({ src: ['assets/sfx_jump.mp3'], rate: 0.5, volume: 1.0 });
            sfxWin = new Howl({ src: ['assets/sfx_win.mp3'], volume: 1.0 });
            sfxHit = new Howl({ src: ['assets/sfx_unlock.mp3'], volume: 1.0 });
        } catch(e) {}

        // --- PART 1 LOGIC ---
        let kisses = 0;
        const GOAL_KISSES = 7;
        let part2Unlocked = false;

        const faceWrapper = document.getElementById('face-wrapper');
        const countEl = document.getElementById('kiss-count');

        function honkNose() {
            if(sfxHonk) sfxHonk.play();
            gsap.to('#cartoon-face', { x: 5, duration: 0.05, yoyo: true, repeat: 5, clearProps:"x" });
        }

        function giveKiss(e) {
            if (part2Unlocked) return; 

            if(sfxKiss) sfxKiss.play();
            kisses++;
            countEl.innerText = kisses;

            // Spawn Mark
            const mark = document.createElement('div');
            mark.classList.add('kiss-mark');
            const rect = faceWrapper.getBoundingClientRect();
            let clientX = e.clientX || e.touches[0].clientX;
            let clientY = e.clientY || e.touches[0].clientY;

            mark.style.left = (clientX - rect.left - 25) + 'px';
            mark.style.top = (clientY - rect.top - 25) + 'px';
            faceWrapper.appendChild(mark);

            gsap.to(mark, { opacity: 1, scale: 1.2, duration: 0.2, yoyo:true, repeat:1, onComplete: () => {
                gsap.set(mark, {scale: 1, opacity: 0.8});
            }});

            if(kisses >= GOAL_KISSES) {
                part2Unlocked = true;
                setTimeout(showLevel2Intro, 1000);
            }
        }

        // --- TRANSITIONS ---
        function showLevel2Intro() {
            gsap.to('#part1-face', { opacity: 0, duration: 0.5, onComplete: () => {
                document.getElementById('part1-face').style.display = 'none';
                document.getElementById('level2-intro').style.display = 'flex';
                gsap.from("#level2-intro h1", { y: -20, opacity: 0, duration: 0.5 });
                gsap.from("#level2-intro button", { scale: 0, delay: 0.3, duration: 0.5, ease: "back.out" });
            }});
        }

        function startLevel2() {
            document.getElementById('level2-intro').style.display = 'none';
            document.getElementById('part2-game').style.display = 'block';
            
            if(bgmGame) bgmGame.play();
            
            initGame();
        }

        // --- PART 2: GAME LOGIC ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let gameActive = false;
        let score = 0;
        
        const playerImg = new Image(); playerImg.src = 'assets/d7_pixel_her.png';
        const enemyImg = new Image(); enemyImg.src = 'assets/d7_enemy.png';
        const heartImg = new Image(); heartImg.src = 'assets/d7_kiss_mark.png';

        let player = { x: 0, y: 0, w: 60, h: 60 };
        let items = [];
        let spawnInterval;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.y = canvas.height - 100;
            player.x = canvas.width / 2 - 30;
        }
        window.addEventListener('resize', resize);

        function initGame() {
            resize();
            gameActive = true;
            score = 0;
            items = [];
            gameLoop();
            spawnInterval = setInterval(spawnItem, 800);
        }

        // Controls
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            let touchX = e.touches[0].clientX;
            player.x = touchX - player.w/2;
        });
        canvas.addEventListener('mousemove', (e) => {
            player.x = e.clientX - player.w/2;
        });

        function spawnItem() {
            if(!gameActive) return;
            let type = Math.random() > 0.4 ? 'enemy' : 'heart'; 
            items.push({
                x: Math.random() * (canvas.width - 50),
                y: -50,
                type: type,
                speed: Math.random() * 3 + 3
            });
        }

        function gameLoop() {
            if(!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Player
            if(playerImg.complete) ctx.drawImage(playerImg, player.x, player.y, player.w, player.h);
            else { ctx.fillStyle = 'white'; ctx.fillRect(player.x, player.y, player.w, player.h); }

            // Items
            for(let i=0; i<items.length; i++) {
                let item = items[i];
                item.y += item.speed;

                if(item.type === 'heart') {
                    if(heartImg.complete) ctx.drawImage(heartImg, item.x, item.y, 50, 50);
                    else { ctx.fillStyle='red'; ctx.fillRect(item.x, item.y, 50, 50); }
                } else {
                    if(enemyImg.complete) ctx.drawImage(enemyImg, item.x, item.y, 50, 50);
                    else { ctx.fillStyle='gray'; ctx.fillRect(item.x, item.y, 50, 50); }
                }

                // Collision
                if(item.y + 50 > player.y && 
                   item.x < player.x + player.w && 
                   item.x + 50 > player.x) {
                    
                    if(item.type === 'heart') {
                        score++;
                        if(sfxKiss) sfxKiss.play();
                        document.getElementById('score').innerText = score;
                        items.splice(i, 1);
                        i--;
                        if(score >= 10) winGame();
                    } else {
                        // Hit Enemy
                        if(sfxHit) sfxHit.play();
                        score = Math.max(0, score - 2); 
                        document.getElementById('score').innerText = score;
                        gsap.to('#part2-game', {x:10, duration:0.05, yoyo:true, repeat:3, clearProps:"x"});
                        items.splice(i, 1);
                        i--;
                    }
                }

                if(item.y > canvas.height) {
                    items.splice(i, 1);
                    i--;
                }
            }
            requestAnimationFrame(gameLoop);
        }

        function winGame() {
            gameActive = false;
            clearInterval(spawnInterval);
            
            // STOP MUSIC
            if(bgmGame) bgmGame.fade(0.4, 0, 2000);
            
            if(sfxWin) sfxWin.play();
            confetti({ particleCount: 300, spread: 150 });
            
            setTimeout(() => {
                document.getElementById('part2-game').style.display = 'none';
                document.getElementById('reward-screen').style.display = 'flex';
                gsap.from('#photo-frame', { scale: 0, rotation: 360, duration: 1 });
            }, 1000);
        }

    </script>
</body>
</html>
