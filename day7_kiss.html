<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kiss Day: Kiss Blaster</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka+One&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            margin: 0; padding: 0; overflow: hidden;
            background: #ffdde1;
            font-family: 'Press Start 2P', cursive;
            touch-action: none; user-select: none;
            display: flex; justify-content: center; align-items: center;
            height: 100dvh;
        }

        /* --- CONTAINER --- */
        #main-container {
            position: relative; width: 100vw; height: 100%;
            overflow: hidden;
            background: #2d3436; 
        }

        /* ================= PART 1: THE FACE ================= */
        #part1-face {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10;
            background: radial-gradient(circle, #fff 0%, #ffdde1 100%);
        }

        #face-wrapper {
            position: relative;
            width: min(80vw, 50vh); 
            height: min(80vw, 50vh);
            margin-bottom: 20px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        #cartoon-face {
            width: 100%; height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.2));
            pointer-events: none;
        }

        #hit-face {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; border-radius: 50%;
        }

        #hit-nose { 
            position: absolute; top: 45%; left: 40%; width: 20%; height: 20%; 
            border-radius: 50%; z-index: 10; cursor: pointer;
        }

        .kiss-mark {
            position: absolute; width: 50px; height: 50px; pointer-events: none;
            display: flex; align-items: center; justify-content: center; font-size: 40px;
            z-index: 15; transform: translate(-50%, -50%); 
        }

        #counter { 
            margin-top: 10px; color: #e84393; 
            font-size: clamp(0.8rem, 3vw, 1.2rem); 
            text-align: center; line-height: 1.5;
        }

        /* ================= PART 2: ARCADE SHOOTER ================= */
        #part2-game {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at bottom, #2d3436 0%, #000 100%);
            z-index: 20;
        }

        #part2-game::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px);
            background-size: 550px 550px, 350px 350px, 250px 250px; 
            background-position: 0 0, 40px 60px, 130px 270px;
            animation: starScroll 20s linear infinite;
            opacity: 0.5;
            z-index: 0;
        }

        @keyframes starScroll {
            from { transform: translateY(0); }
            to { transform: translateY(550px); }
        }
        
        canvas { position: relative; display: block; width: 100%; height: 100%; z-index: 1; }

        #game-ui {
            position: absolute; top: 10px; left: 0; width: 100%;
            display: flex; justify-content: space-between; padding: 0 20px;
            box-sizing: border-box;
            color: #ff7675; text-shadow: 2px 2px 0 #000;
            font-size: clamp(0.7rem, 2.5vw, 1rem);
            z-index: 25; pointer-events: none;
        }

        #boss-hud {
            display: none; position: absolute; top: 60px; left: 50%; 
            transform: translateX(-50%); width: 80%; text-align: center;
            z-index: 25;
        }
        #boss-name { color: #fd79a8; font-size: 0.8rem; margin-bottom: 5px; text-shadow: 2px 2px 0 #000; }
        #hp-bar-container {
            width: 100%; height: 15px; background: #333; border: 2px solid white; border-radius: 10px; overflow: hidden;
        }
        #hp-bar-fill {
            width: 100%; height: 100%; background: linear-gradient(90deg, #e84393, #fd79a8);
            transition: width 0.2s;
        }

        #level2-intro {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 30;
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center; color: white;
            padding: 20px; box-sizing: border-box;
        }

        .retro-btn {
            background: #e84393; color: white; border: 4px solid white;
            padding: 15px 25px; font-family: 'Press Start 2P'; 
            font-size: clamp(0.7rem, 2.5vw, 1rem);
            cursor: pointer; margin-top: 30px; box-shadow: 6px 6px 0 #000;
            text-transform: uppercase;
        }
        .retro-btn:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0 #000; }

        #reward-screen {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 107, 129, 0.95); z-index: 50;
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center;
        }

        #photo-frame {
            background: white; padding: 15px 15px 50px 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transform: rotate(-3deg); margin-bottom: 30px;
            width: 70%; max-width: 300px;
            position: relative;
        }
        
        #photo-frame img {
            width: 100%; height: auto; border: 1px solid #ddd; display: block;
        }

        #photo-frame::after {
            content: '❤️'; position: absolute; top: -15px; right: -15px; font-size: 2rem;
            animation: floatHeart 2s ease-in-out infinite;
        }

        @keyframes floatHeart { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }
    </style>
</head>
<body>

    <div id="main-container">

        <div id="part1-face">
            <h1 style="color:#e84393; font-size:clamp(0.8rem, 4vw, 1.2rem); margin-bottom:20px; text-align:center; line-height:1.5;">
                MISSION: 7 KISSES
            </h1>
            
            <div id="face-wrapper">
                <img id="cartoon-face" src="assets/d7_face_cartoon.png" alt="My Face" onerror="this.src='https://api.dicebear.com/7.x/avataaars/svg?seed=Felix'">
                <div id="hit-face" onclick="giveKiss(event)"></div>
                <div id="hit-nose" onclick="honkNose(event)"></div>
            </div>

            <div id="counter">
                Collected: <span id="kiss-count">0</span>/7<br>
                <span style="font-size:0.6rem; color:#636e72; margin-top:5px; display:block;">(Tap face to collect kisses)</span>
            </div>
        </div>

        <div id="level2-intro">
            <h1 style="color:#fd79a8; margin-bottom: 20px; font-size: clamp(1rem, 5vw, 1.5rem); line-height: 1.5;">KISS BLASTER<br>READY?</h1>
            <p style="line-height: 1.8; font-size: clamp(0.7rem, 3vw, 1rem); max-width: 80%; font-family: 'Fredoka One', sans-serif;">
                Bad vibes are falling!<br>
                Blast them with Kisses 💋<br><br>
                Defeat the <span style="color:#ff7675">BOSS</span> with Love!
            </p>
            <button class="retro-btn" onclick="startShooterGame()">LAUNCH MISSION</button>
        </div>

        <div id="part2-game">
            <div id="game-ui">
                <div>SCORE: <span id="score">0</span></div>
                <div id="wave-text">WAVE 1</div>
            </div>

            <div id="boss-hud">
                <div id="boss-name">BOSS: YOUR HUSBAND ❤️</div>
                <div id="hp-bar-container"><div id="hp-bar-fill"></div></div>
            </div>

            <canvas id="gameCanvas"></canvas>
        </div>

        <div id="reward-screen">
            <h1 style="color:#fff; margin-bottom:20px; font-size: 1.5rem; text-shadow: 2px 2px 0 #000;">YOU WON MY HEART!</h1>
            <div id="photo-frame">
                <img src="assets/d7_reward.png" alt="Us">
                <div style="color:#333; font-family:'Fredoka One', sans-serif; font-size:1.2rem; margin-top:10px;">Official Kiss ❤️</div>
            </div>
            <button class="retro-btn" onclick="location.href='index.html'">BACK TO MENU</button>
        </div>

    </div>

    <script>
        // --- AUDIO SYSTEM ---
        const audio = {
            bgm: null,
            shoot: null,
            kiss: null, // Added Kiss Sound back
            boss: null,
            win: null
        };

        try {
            audio.bgm = new Howl({ src: ['assets/bgm_game.mp3'], loop: true, volume: 0.3 });
            audio.shoot = new Howl({ src: ['assets/sfx_shoot.mp3'], volume: 0.1 }); // Softer shooting sound
            // RESTORED KISS SOUND
            audio.kiss = new Howl({ src: ['assets/sfx_kiss.mp3'], volume: 0.8 }); 
            audio.boss = new Howl({ src: ['assets/sfx_alarm.mp3'], volume: 0.5 });
            audio.win = new Howl({ src: ['assets/sfx_win.mp3'], volume: 0.8 });
        } catch(e) { console.log("Audio issues"); }

        // --- ASSETS LOADING ---
        const heroImg = new Image(); heroImg.src = 'assets/d7_her.png';
        const bossImg = new Image(); bossImg.src = 'assets/d7_me.png';

        // --- PART 1 LOGIC (Face Kissing) ---
        let kisses = 0;
        const GOAL_KISSES = 7;
        let part2Unlocked = false;

        const faceWrapper = document.getElementById('face-wrapper');
        const countEl = document.getElementById('kiss-count');

        function honkNose(e) {
            e.stopPropagation();
            gsap.to('#cartoon-face', { scale: 1.2, duration: 0.1, yoyo: true, repeat: 1 });
        }

        function giveKiss(e) {
            if (part2Unlocked) return; 
            
            // PLAY KISS SOUND
            if(audio.kiss) audio.kiss.play();

            kisses++;
            countEl.innerText = kisses;

            const mark = document.createElement('div');
            mark.classList.add('kiss-mark');
            mark.innerText = "💋"; 
            
            const rect = faceWrapper.getBoundingClientRect();
            let clientX = e.clientX || (e.changedTouches ? e.changedTouches[0].clientX : 0);
            let clientY = e.clientY || (e.changedTouches ? e.changedTouches[0].clientY : 0);

            mark.style.left = (clientX - rect.left) + 'px';
            mark.style.top = (clientY - rect.top) + 'px';
            faceWrapper.appendChild(mark);

            gsap.fromTo(mark, 
                { scale: 0, opacity: 0, rotation: -45 }, 
                { scale: 1, opacity: 1, rotation: 0, duration: 0.4, ease: "back.out" }
            );

            if(kisses >= GOAL_KISSES) {
                part2Unlocked = true;
                setTimeout(showLevel2Intro, 1000);
            }
        }

        function showLevel2Intro() {
            gsap.to('#part1-face', { opacity: 0, duration: 0.5, onComplete: () => {
                document.getElementById('part1-face').style.display = 'none';
                document.getElementById('level2-intro').style.display = 'flex';
                gsap.from("#level2-intro h1", { scale: 0.5, opacity: 0, duration: 0.5 });
            }});
        }

        function startShooterGame() {
            document.getElementById('level2-intro').style.display = 'none';
            document.getElementById('part2-game').style.display = 'block';
            if(audio.bgm) audio.bgm.play();
            initShooter();
        }

        // --- PART 2: VERTICAL SHOOTER LOGIC ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let gameActive = false;
        let score = 0;
        let frames = 0;
        let bossActive = false;
        let bossHP = 50;
        const BOSS_MAX_HP = 50;

        let player = { x: 0, y: 0, w: 60, h: 60 };
        let bullets = [];
        let enemies = [];
        let particles = [];
        let boss = { x: 0, y: -120, w: 120, h: 120, dir: 1 };

        function resize() {
            const container = document.getElementById('part2-game');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            player.y = canvas.height - 90;
            if(player.x === 0) player.x = canvas.width/2 - player.w/2;
        }
        window.addEventListener('resize', resize);

        function initShooter() {
            resize();
            gameActive = true;
            score = 0;
            frames = 0;
            bossActive = false;
            bossHP = BOSS_MAX_HP;
            bullets = [];
            enemies = [];
            particles = [];
            
            canvas.addEventListener('touchmove', handleInput, { passive: false });
            canvas.addEventListener('mousemove', handleInput);
            gameLoop();
        }

        function handleInput(e) {
            e.preventDefault();
            let cx = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            player.x = cx - player.w/2;
            if(player.x < 0) player.x = 0;
            if(player.x > canvas.width - player.w) player.x = canvas.width - player.w;
        }

        function spawnEnemy() {
            const type = Math.random() > 0.5 ? '💔' : (Math.random() > 0.5 ? '🌧️' : '😠');
            enemies.push({
                x: Math.random() * (canvas.width - 40),
                y: -50,
                w: 40, h: 40,
                speed: Math.random() * 2 + 2,
                txt: type
            });
        }

        function createParticles(x, y, color) {
            for(let i=0; i<8; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    life: 1.0,
                    color: color
                });
            }
        }

        function gameLoop() {
            if(!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            frames++;

            // --- 1. PLAYER & SHOOTING ---
            if(frames % 12 === 0) {
                bullets.push({ x: player.x + player.w/2 - 10, y: player.y, w: 20, h: 20, speed: 10 });
                if(audio.shoot) audio.shoot.play();
            }

            if(heroImg.complete && heroImg.naturalWidth > 0) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(player.x + player.w/2, player.y + player.h/2, player.w/2, 0, Math.PI * 2);
                ctx.closePath();
                ctx.clip();
                ctx.drawImage(heroImg, player.x, player.y, player.w, player.h);
                ctx.restore();
            } else {
                ctx.font = "50px Arial";
                ctx.fillText("🦸‍♀️", player.x, player.y + 50);
            }

            // --- 2. BOSS LOGIC ---
            if(score >= 15 && !bossActive) {
                bossActive = true;
                if(audio.boss) audio.boss.play();
                document.getElementById('boss-hud').style.display = 'block';
                document.getElementById('wave-text').innerText = "BOSS FIGHT!";
                document.getElementById('wave-text').style.color = "red";
                gsap.to(boss, { y: 80, duration: 2, ease: "elastic.out(1, 0.5)" });
            }

            if(bossActive) {
                boss.x += 2 * boss.dir;
                if(boss.x < 0 || boss.x > canvas.width - boss.w) boss.dir *= -1;
                
                if(bossImg.complete && bossImg.naturalWidth > 0) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(boss.x + boss.w/2, boss.y + boss.h/2, boss.w/2, 0, Math.PI * 2);
                    ctx.closePath();
                    ctx.clip();
                    ctx.drawImage(bossImg, boss.x, boss.y, boss.w, boss.h);
                    ctx.restore();
                } else {
                    ctx.font = "80px Arial";
                    ctx.fillText("😈", boss.x + 10, boss.y + 80);
                }
                
                bullets.forEach((b, bIdx) => {
                    if(b.x > boss.x && b.x < boss.x + boss.w &&
                       b.y > boss.y && b.y < boss.y + boss.h) {
                           
                        bullets.splice(bIdx, 1);
                        createParticles(b.x, b.y, '#fd79a8');
                        
                        // PLAY KISS SOUND ON HIT
                        if(audio.kiss) audio.kiss.play();

                        bossHP--;
                        boss.x += (Math.random() * 10 - 5);

                        let pct = (bossHP / BOSS_MAX_HP) * 100;
                        document.getElementById('hp-bar-fill').style.width = pct + "%";

                        if(bossHP <= 0) winGame();
                    }
                });
            }

            // --- 3. ENEMIES ---
            if(!bossActive && frames % 40 === 0) spawnEnemy();

            for(let i=0; i<enemies.length; i++) {
                let e = enemies[i];
                e.y += e.speed;
                
                ctx.font = "40px Arial";
                ctx.fillText(e.txt, e.x, e.y + 35);

                for(let j=0; j<bullets.length; j++) {
                    let b = bullets[j];
                    if(b.x < e.x + e.w && b.x + b.w > e.x &&
                       b.y < e.y + e.h && b.y + b.h > e.y) {
                        
                        score++;
                        document.getElementById('score').innerText = score;
                        createParticles(e.x + e.w/2, e.y + e.h/2, '#e84393');
                        
                        // PLAY KISS SOUND ON HIT
                        if(audio.kiss) audio.kiss.play();

                        particles.push({
                            x: e.x, y: e.y, vx: 0, vy: -2, life: 1.5,
                            isFloatingText: true, txt: "❤️"
                        });

                        enemies.splice(i, 1);
                        bullets.splice(j, 1);
                        i--; j--;
                        break;
                    }
                }
                if(e.y > canvas.height) { enemies.splice(i, 1); i--; }
            }

            // --- 4. BULLETS ---
            for(let i=0; i<bullets.length; i++) {
                let b = bullets[i];
                b.y -= b.speed;
                ctx.font = "20px Arial";
                ctx.fillText("💋", b.x, b.y + 20);
                if(b.y < -20) { bullets.splice(i, 1); i--; }
            }

            // --- 5. PARTICLES ---
            for(let i=0; i<particles.length; i++) {
                let p = particles[i];
                p.life -= 0.05;
                p.x += p.vx || 0;
                p.y += p.vy || 0;
                
                if(p.isFloatingText) {
                    ctx.globalAlpha = p.life;
                    ctx.font = "40px Arial";
                    ctx.fillText(p.txt, p.x, p.y);
                    ctx.globalAlpha = 1;
                } else {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }
                if(p.life <= 0) { particles.splice(i, 1); i--; }
            }
            requestAnimationFrame(gameLoop);
        }

        function winGame() {
            gameActive = false;
            if(audio.bgm) audio.bgm.fade(0.3, 0, 1000);
            if(audio.win) audio.win.play();

            confetti({ particleCount: 200, spread: 100, origin: { y: 0.3 } });

            setTimeout(() => {
                document.getElementById('part2-game').style.display = 'none';
                document.getElementById('reward-screen').style.display = 'flex';
                gsap.from('#photo-frame', { scale: 0, rotation: 360, duration: 1.2, ease: "elastic.out(1, 0.75)" });
            }, 1500);
        }
    </script>
</body>
</html>
