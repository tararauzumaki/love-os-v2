            <a href="day6_hug.html" class="card">

            <a href="day7_kiss.html" class="card">

            <a href="day8_valentine.html" class="card final">
                <div class="icon"><span class="emoji">❤️</span></div>

            <p>Built with ❤️ by Tanvir</p>

    <script src="lib/script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {

    // ---------------------------------------------------------
    // ⚙️ CONFIGURATION
    // ---------------------------------------------------------
    const DEV_MODE = false;  // Set TRUE to test, FALSE to lock
    const TARGET_YEAR = 2026;
    const TARGET_MONTH = 1;  // 0 = Jan, 1 = Feb, 2 = Mar
    
    // ---------------------------------------------------------
    // 🕵️ DEBUGGER (Remove this block after testing!)
    // ---------------------------------------------------------
    /* const now = new Date();
    alert("SYSTEM CHECK:\n" + 
          "Script is RUNNING.\n" +
          "Your Date: " + now.toDateString() + "\n" +
          "Your Time: " + now.toLocaleTimeString());
    */
    // ---------------------------------------------------------

    // Simple Day Schedule (Just the day number in Feb)
    const schedule = [
        { id: 'day1_rose.html',      day: 7,  name: "Rose Day" },
        { id: 'day2_propose.html',   day: 8,  name: "Propose Day" },
        { id: 'day3_chocolate.html', day: 9,  name: "Chocolate Day" },
        { id: 'day4_teddy.html',     day: 10, name: "Teddy Day" },
        { id: 'day5_promise.html',   day: 11, name: "Promise Day" },
        { id: 'day6_hug.html',       day: 12, name: "Hug Day" },
        { id: 'day7_kiss.html',      day: 13, name: "Kiss Day" },
        { id: 'day8_valentine.html', day: 14, name: "The Finale" }
    ];

    // 1. LOCK SYSTEM
    schedule.forEach(item => {
        const card = document.querySelector(`a[href="${item.id}"]`);
        
        if (card) {
            // Function to check lock status based on "Right Now"
            const isLocked = () => {
                if (DEV_MODE) return false;

                const now = new Date();
                const currentYear = now.getFullYear();
                const currentMonth = now.getMonth();
                const currentDay = now.getDate();

                // Logic: 
                // If it's before 2026 -> LOCKED
                // If it's 2026 but Jan (Month 0) -> LOCKED
                // If it's Feb 2026 but the day hasn't come yet -> LOCKED
                
                if (currentYear < TARGET_YEAR) return true;
                if (currentYear === TARGET_YEAR && currentMonth < TARGET_MONTH) return true;
                if (currentYear === TARGET_YEAR && currentMonth === TARGET_MONTH && currentDay < item.day) return true;
                
                return false; // Otherwise, UNLOCK
            };

            // A. Visual Lock (Runs on Load)
            if (isLocked()) {
                card.classList.add('locked');
            }

            // B. Click Intercept (Runs on Click)
            card.addEventListener('click', (e) => {
                if (isLocked()) {
                    e.preventDefault(); // Stop the link!
                    
                    // Calculate days left
                    const now = new Date();
                    const daysLeft = item.day - now.getDate();
                    
                    alert(`🔒 Locked!\n${item.name} is scheduled for Feb ${item.day}.\n(You're a bit too early!)`);
                }
            });
        }
    });

    // 2. ANIMATIONS (Only runs if GSAP loaded correctly)
    if (typeof gsap !== 'undefined') {
        gsap.from(".title", { duration: 1, y: -50, opacity: 0, ease: "bounce.out" });

        const textElement = document.getElementById("typing-text");
        const textToType = "Initializing Heartbeat...";
        
        if (textElement) {
            textElement.textContent = ""; 
            let i = 0;
            function typeWriter() {
                if (i < textToType.length) {
                    textElement.textContent += textToType.charAt(i);
                    i++;
                    setTimeout(typeWriter, 50); 
                } else {
                    revealCards();
                }
            }
            setTimeout(typeWriter, 500);
        } else {
            revealCards();
        }

        function revealCards() {
            gsap.from(".card", { duration: 0.5, scale: 0.8, opacity: 0, stagger: 0.1, ease: "back.out(1.7)" });
        }
        
        gsap.from("footer", { delay: 2.5, opacity: 0, duration: 1 });
    }
});
                          </script>
</body>
</html>
