<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Propose Day: The Question</title>
    
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&family=VT323&display=swap" rel="stylesheet">

    <script src="lib/gsap.min.js"></script>
    <script src="lib/howler.min.js"></script>
    <script src="lib/confetti.browser.min.js"></script>

    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #2d3436; font-family: 'Quicksand', sans-serif; }
        #vn-container { position: relative; width: 100vw; height: 100vh; overflow: hidden; }

        /* --- LAYERS --- */
        #bg-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('assets/d2_bg.png'); /* PNG check */
            background-size: cover; background-position: center; z-index: 1; 
        }

        #character {
            position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%);
            height: 85vh; max-width: 90vw; object-fit: contain; z-index: 5; 
            display: none; filter: drop-shadow(0 0 10px rgba(0,0,0,0.3));
        }

        /* --- DIALOGUE UI --- */
        #dialogue-box {
            position: absolute; bottom: 20px; left: 5%; width: 90%; 
            min-height: 150px; height: auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px; border: 3px solid #ff9a9e;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 50; 
            padding: 20px; padding-bottom: 40px; box-sizing: border-box;
            display: flex; flex-direction: column; pointer-events: none; /* Let clicks pass to container */
        }

        #speaker-name { font-family: 'Dancing Script', cursive; font-size: 1.8rem; color: #ff4757; margin-bottom: 8px; font-weight: bold; }
        #text-content { font-size: 1.1rem; color: #2d3436; line-height: 1.4; }

        /* TAP GUIDE */
        #tap-guide {
            position: absolute; bottom: 10px; right: 20px;
            font-size: 0.9rem; color: #ff4757; opacity: 0;
            animation: bounce 1s infinite; font-weight: bold;
        }
        @keyframes bounce { 0%, 100% { transform: translateY(0); opacity: 1; } 50% { transform: translateY(-5px); opacity: 0.5; } }

        /* INVISIBLE CLICK LAYER (Covers whole screen) */
        #click-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 60; cursor: pointer;
        }

        /* --- CHOICES --- */
        #choices-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 100; 
            display: none; flex-direction: column; justify-content: center; align-items: center; gap: 20px;
        }

        /* Update this in the <style> section of EVERY file */
body, #game-container, #main-container {
    height: 100vh;       /* Fallback */
    height: 100dvh;      /* <--- Dynamic Viewport Height (The Fix) */
    overflow: hidden;    /* Prevents scrolling */
}


        .choice-btn {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            border: 4px solid white; padding: 20px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: 700; color: #d63031;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); cursor: pointer;
            width: 80%; max-width: 300px; text-transform: uppercase;
        }
        
        /* The "No" button looks normal initially */
        #btn-no { background: linear-gradient(135deg, #a4b0be 0%, #747d8c 100%); color: white; }

        /* --- START SCREEN --- */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #2d3436; display: flex; justify-content: center; align-items: center;
            z-index: 200; color: white; flex-direction: column;
        }

        /* --- BSOD (Blue Screen of Death) --- */
        #bsod {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #0078d7; color: white; z-index: 300;
            padding: 40px; box-sizing: border-box; font-family: 'VT323', monospace;
        }
        .sad-face { font-size: 100px; margin-bottom: 20px; display: block; }
    </style>
</head>
<body>

    <div id="vn-container">
        <div id="bg-layer"></div>
        
        <img id="character" src="assets/d2_her_happy.png" alt="Her">
        
        <div id="click-layer" style="display:none;"></div>

        <div id="start-screen">
            <h1 style="font-family:'Dancing Script'; font-size:3rem; color:#ff9a9e; margin-bottom: 10px;">Chapter 2</h1>
            <p style="font-size: 1.2rem; margin-bottom: 30px;">The Question</p>
            <button class="choice-btn" id="start-btn">Start Story</button>
        </div>

        

        <div id="dialogue-box" style="display:none;">
            <div id="speaker-name">Tanvir</div>
            <div id="text-content">...</div>
            <div id="tap-guide">Tap </div>
        </div>

        <div id="choices-overlay">
            <h1 style="color:white; font-family:'Dancing Script'; font-size: 2.2rem; text-align:center; padding: 0 20px;">
                Will you be my Valentine?
            </h1>
            <button class="choice-btn" onclick="acceptProposal()">YES! </button>
            <button class="choice-btn" id="btn-no" onclick="rejectProposal()">No, sorry.</button>
        </div>

        <div id="bsod">
            <span class="sad-face">:(</span>
            <h2>Your PC ran into a problem and needs to restart.</h2>
            <p>CRITICAL_PROCESS_DIED: <br>Reason: World cannot exist without Her.</p>
            <br>
            <p>Error Code: 0xLOVE_NOT_FOUND</p>
            <p>Rebooting System... <span id="percent">0%</span></p>
        </div>
    </div>

    <script>
        // --- SETUP ---
        const bgm = new Howl({ src: ['assets/bgm_romantic.mp3'], loop: true, volume: 0.5 });
        const sfxClick = new Howl({ src: ['assets/sfx_collect.mp3'], volume: 0.3 });
        const sfxGlitch = new Howl({ src: ['assets/sfx_jump.mp3'], rate: 0.5, volume: 1.0 }); // Weird low sound
        const sfxWin = new Howl({ src: ['assets/sfx_win.mp3'], volume: 0.8 });

        const script = [
            { speaker: "Tanvir", text: "It's been more than 2 years since we started this journey...", sprite: "none" },
            { speaker: "Tanvir", text: "Every day with you feels like a new episode of my favorite anime.", sprite: "none" },
            { speaker: "Her", text: "Pakhi? You look like you're compiling a heavy code. What's on your mind?", sprite: "happy" },
            { speaker: "Tanvir", text: "Just thinking... about how boring my life was before I met you.", sprite: "happy" },
            { speaker: "Tanvir", text: "You brought color to my grayscale world.", sprite: "happy" },
            { speaker: "Her", text: "Oh? Is this the part where you ask me to make you noodles or jhalmuri? ", sprite: "surprised" },
            { speaker: "Tanvir", text: "No. Well, maybe later. But right now, I have a question.", sprite: "happy" },
            { speaker: "Tanvir", text: "If I could refactor my life a thousand times, I would choose you in every single version.", sprite: "happy" },
            { speaker: "Tanvir", text: "Will you be my Valentine, my Player 2, and my bug-fixer... forever?", sprite: "surprised" }
        ];

        let currentIndex = 0;
        let isTyping = false;
        let forcedYes = false; // Tracks if she already tried to say No

        const dialogueBox = document.getElementById('dialogue-box');
        const speakerName = document.getElementById('speaker-name');
        const textContent = document.getElementById('text-content');
        const charImg = document.getElementById('character');
        const choicesOverlay = document.getElementById('choices-overlay');
        const startScreen = document.getElementById('start-screen');
        const clickLayer = document.getElementById('click-layer');
        const tapGuide = document.getElementById('tap-guide');
        const bsod = document.getElementById('bsod');

        // --- START ---
        document.getElementById('start-btn').addEventListener('click', () => {
            startScreen.style.display = 'none';
            dialogueBox.style.display = 'flex';
            clickLayer.style.display = 'block'; // Enable full screen clicking
            bgm.play();
            showDialogue();
        });

        // --- DISPLAY DIALOGUE ---
        function showDialogue() {
            tapGuide.style.opacity = 0; // Hide guide while typing

            if (currentIndex >= script.length) {
                // END OF STORY
                dialogueBox.style.display = 'none';
                clickLayer.style.display = 'none';
                choicesOverlay.style.display = 'flex';
                
                // Show buttons
                gsap.from(".choice-btn", { scale: 0, opacity: 0, duration: 0.5, stagger: 0.2, ease: "back.out" });
                return;
            }

            const line = script[currentIndex];
            speakerName.innerText = line.speaker;
            speakerName.style.color = (line.speaker === "Tanvir") ? "#0984e3" : "#ff4757";

            // Sprite Logic
            if (line.sprite === "none") {
                charImg.style.display = 'none';
            } else {
                charImg.style.display = 'block';
                const src = line.sprite === "happy" ? "assets/d2_her_happy.png" : "assets/d2_her_surprised.png";
                if (charImg.src.indexOf(src) === -1) {
                    charImg.src = src;
                    gsap.fromTo(charImg, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5 });
                }
            }

            // Typing Logic
            textContent.innerHTML = "";
            isTyping = true;
            let i = 0;
            function type() {
                if (i < line.text.length) {
                    textContent.innerHTML += line.text.charAt(i);
                    i++;
                    setTimeout(type, 30);
                } else {
                    isTyping = false;
                    tapGuide.style.opacity = 1; // Show guide when done
                }
            }
            type();
        }

        // --- TAP ANYWHERE TO ADVANCE ---
        clickLayer.addEventListener('click', () => {
            if (!isTyping) {
                sfxClick.play();
                currentIndex++;
                showDialogue();
            }
        });

        // --- THE UNIQUE "NO" INTERACTION (BSOD GLITCH) ---
        window.rejectProposal = function() {
            sfxGlitch.play();
            bgm.stop();
            
            // 1. Show BSOD
            bsod.style.display = 'block';
            
            // 2. Fake Progress Bar
            let p = 0;
            const interval = setInterval(() => {
                p += Math.floor(Math.random() * 10) + 5;
                if(p > 100) p = 100;
                document.getElementById('percent').innerText = p + "%";
                
                if (p === 100) {
                    clearInterval(interval);
                    rebootSystem();
                }
            }, 300);
        };

        function rebootSystem() {
            // 3. Reboot back to choices, but "NO" is gone
            bsod.style.display = 'none';
            bgm.play();
            
            // Remove "No" Button
            const noBtn = document.getElementById('btn-no');
            noBtn.style.display = 'none';

            // Change Title
            document.querySelector('#choices-overlay h1').innerText = "System Recovered. \nOnly one valid option remains.";
            
            // Make "YES" huge
            const yesBtn = document.querySelector('.choice-btn');
            yesBtn.style.transform = "scale(1.5)";
            yesBtn.innerText = "YES (Obviously) ";
        }

        // --- ACCEPT ---
        window.acceptProposal = function() {
            sfxWin.play();
            bgm.fade(0.5, 0, 2000);
            confetti({ particleCount: 300, spread: 100, origin: { y: 0.6 } });
            
            choicesOverlay.innerHTML = `
                <h1 style='color:white; font-family:Dancing Script; font-size:3rem; text-align:center;'>
                    Decision Saved! 
                </h1>
                <p style="color:white; font-size:1.2rem;">See you later, alligator...</p>
            `;
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 4000);
        };
    </script>
</body>
</html>
