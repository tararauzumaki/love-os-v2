<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chocolate Day: Sweet Catch</title>
    
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

    <script src="lib/gsap.min.js"></script>
    <script src="lib/howler.min.js"></script>
    <script src="lib/confetti.browser.min.js"></script>

    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; 
            background: #ffeaa7; 
            font-family: 'Quicksand', sans-serif; 
            touch-action: none; user-select: none;
        }

        #game-container { position: relative; width: 100vw; height: 100vh; overflow: hidden; }

        /* --- BACKGROUND --- */
        #bg-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            /* Fallback Gradient if d3_bg.png is missing */
            background: linear-gradient(180deg, #81ecec 0%, #74b9ff 100%);
            z-index: 1;
        }
        /* If you have the image, this overwrites the gradient */
        #bg-layer.has-image {
            background-image: url('assets/d3_bg.png'); 
            background-size: cover; background-position: center;
        }

        /* --- UI --- */
        #ui-layer {
            position: absolute; top: 20px; left: 20px; z-index: 50;
            background: rgba(255,255,255,0.9);
            padding: 10px 20px; border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            font-family: 'Fredoka One', cursive; color: #6c5ce7;
            font-size: 1.5rem; display: flex; gap: 10px; align-items: center;
        }

        /* --- PLAYER --- */
        #player {
            position: absolute; bottom: 20px; left: 50%; 
            width: 100px; height: 80px; 
            transform: translateX(-50%);
            background-image: url('assets/d3_basket.png');
            background-size: contain; background-repeat: no-repeat; background-position: bottom center;
            z-index: 20;
        }

        /* --- ITEMS --- */
        .item {
            position: absolute; top: -80px; 
            width: 60px; height: 60px;
            background-size: contain; background-repeat: no-repeat;
            z-index: 10;
        }
        
        .choco { background-image: url('assets/d3_choco.png'); }
        .bomb  { background-image: url('assets/d3_bad.png'); } /* The Angry Emoji */
        
        /* The Giant Golden Chocolate */
        .gold-boss { 
            background-image: url('assets/d3_gold_choco.png'); 
            width: 150px; height: 150px; /* Massive */
            filter: drop-shadow(0 0 20px gold);
            z-index: 30;
        }

        /* --- SCREENS --- */
        .screen-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
            z-index: 100; text-align: center;
            background: rgba(0,0,0,0.85); color: white;
        }

        #start-screen { background: rgba(255, 234, 167, 0.95); }
        #game-over-screen { display: none; }
        #win-screen { display: none; background: rgba(255, 215, 0, 0.95); color: #d35400; }

        .btn-start {
            background: #0984e3; color: white; border: 4px solid white;
            padding: 20px 50px; font-size: 1.5rem; border-radius: 50px;
            font-family: 'Fredoka One', cursive; cursor: pointer;
            box-shadow: 0 10px 0 #0652dd; margin-top: 20px;
            transition: transform 0.1s;
        }
        .btn-start:active { transform: translateY(4px); box-shadow: 0 0 0 #0652dd; }

        /* Floating Score */
        .float-score {
            position: absolute; font-family: 'Fredoka One'; font-size: 2rem; 
            pointer-events: none; z-index: 30; text-shadow: 2px 2px 0 #000;
        }
        
        /* Ticket Style for Reward */
        .ticket {
            background: white; color: #333; padding: 20px; border: 2px dashed #333;
            transform: rotate(-2deg); margin-bottom: 20px;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="bg-layer"></div>
        
        <div id="ui-layer">
            <span>🍫</span> <span id="score">0</span> / 70
        </div>

        <div id="start-screen" class="screen-overlay">
            <h1 style="color:#0984e3; font-family:'Fredoka One'; font-size: 3rem; margin-bottom: 10px;">Sweet Catch</h1>
            <p style="color:#636e72; font-size: 1.2rem; margin-bottom: 30px;">
                Collect 70 Points to Win!<br><br>
                🍫 Chocolate = <span style="color:#00b894">+5 Points</span><br>
                😡 Angry Emoji = <span style="color:#d63031">GAME OVER</span>
            </p>
            <button class="btn-start" id="start-btn">START</button>
        </div>

        <div id="game-over-screen" class="screen-overlay">
            <h1 style="color:#d63031; font-family:'Fredoka One';">OOPS!</h1>
            <p style="font-size: 1.2rem;">You caught an angry emoji!</p>
            <button class="btn-start" style="background:#d63031; box-shadow:0 10px 0 #a21b24" id="restart-btn">TRY AGAIN</button>
        </div>

        <div id="win-screen" class="screen-overlay">
            <h1 style="font-family:'Fredoka One'; font-size: 3rem;">JACKPOT!</h1>
            
            <div class="ticket">
                <h2 style="margin:0; font-size:1.5rem;">OFFICIAL COUPON</h2>
                <hr>
                <p style="font-size: 1.2rem; font-weight:bold;">1x 5 Taka Chocolate Bar</p>
                <p style="font-size: 0.8rem; color:#666;">Fully paid by Tanvir</p>
            </div>

            <button class="btn-start" onclick="location.href='index.html'" style="background:#fff; color:#d35400; box-shadow:0 10px 0 #e67e22">CLAIM & EXIT</button>
        </div>

        <div id="player"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- AUDIO ---
            let bgm, sfxCatch, sfxWin, sfxDie;
            try {
                bgm = new Howl({ src: ['assets/bgm_game.mp3'], loop: true, volume: 0.4 });
                sfxCatch = new Howl({ src: ['assets/sfx_collect.mp3'], volume: 0.6 });
                sfxWin = new Howl({ src: ['assets/sfx_win.mp3'], volume: 1.0 });
                sfxDie = new Howl({ src: ['assets/sfx_jump.mp3'], rate: 0.5, volume: 1.0 }); // Low pitch
            } catch(e) {}

            // --- CONFIG ---
            const GOAL_SCORE = 70;
            let spawnRate = 800; 
            let score = 0;
            let gameActive = false;
            let spawnInterval;
            let bossPhase = false;

            // --- DOM ---
            const player = document.getElementById('player');
            const container = document.getElementById('game-container');
            const scoreEl = document.getElementById('score');
            const startScreen = document.getElementById('start-screen');
            const gameOverScreen = document.getElementById('game-over-screen');
            const winScreen = document.getElementById('win-screen');

            // --- CONTROLS ---
            function movePlayer(e) {
                if (!gameActive) return;
                let clientX = e.touches ? e.touches[0].clientX : e.clientX;
                let percent = (clientX / window.innerWidth) * 100;
                percent = Math.max(10, Math.min(90, percent));
                gsap.set(player, { left: percent + "%" });
            }
            container.addEventListener('mousemove', movePlayer);
            container.addEventListener('touchmove', movePlayer, { passive: false });

            // --- SPAWNING LOGIC ---
            function spawnItem() {
                if (!gameActive || bossPhase) return;

                const item = document.createElement('div');
                item.classList.add('item');
                
                // 30% Chance of Bomb (Angry Emoji)
                const isBomb = Math.random() > 0.7; 
                item.classList.add(isBomb ? 'bomb' : 'choco');
                item.dataset.type = isBomb ? 'bomb' : 'choco';

                item.style.left = (Math.random() * 90 + 5) + "%";
                container.appendChild(item);

                // Bomb falls faster than Choco
                const speed = isBomb ? Math.random() * 1.5 + 2 : Math.random() * 2 + 3;

                gsap.to(item, {
                    top: window.innerHeight,
                    duration: speed,
                    ease: "none",
                    onUpdate: () => checkCollision(item),
                    onComplete: () => item.remove()
                });
            }

            // --- COLLISION ---
            function checkCollision(item) {
                if (!gameActive || item.dataset.caught) return;

                const pRect = player.getBoundingClientRect();
                const iRect = item.getBoundingClientRect();

                if (iRect.bottom > pRect.top + 20 && iRect.top < pRect.bottom &&
                    iRect.right > pRect.left + 20 && iRect.left < pRect.right - 20) {
                    catchItem(item);
                }
            }

            function catchItem(item) {
                item.dataset.caught = "true";
                gsap.killTweensOf(item);
                item.remove();

                const type = item.dataset.type;

                if (type === 'choco') {
                    updateScore(5, item); // +5 Points
                    if(sfxCatch) sfxCatch.play();
                    gsap.fromTo(player, { scaleY: 0.8 }, { scaleY: 1, duration: 0.2 });
                } 
                else if (type === 'bomb') {
                    gameOver();
                }
                else if (type === 'gold') {
                    triggerWin();
                }
            }

            function updateScore(amount, itemRef) {
                score += amount;
                scoreEl.innerText = score;

                // +5 Text
                const floatText = document.createElement('div');
                floatText.classList.add('float-score');
                floatText.innerText = "+" + amount;
                floatText.style.left = itemRef.style.left;
                floatText.style.top = (window.innerHeight - 150) + "px";
                floatText.style.color = '#00b894';
                container.appendChild(floatText);
                gsap.to(floatText, { y: -50, opacity: 0, duration: 1, onComplete: () => floatText.remove() });

                // CHECK GOAL
                if (score >= GOAL_SCORE && !bossPhase) {
                    startBossPhase();
                }
            }

            // --- BOSS PHASE (THE GOLDEN CHOCOLATE) ---
            function startBossPhase() {
                bossPhase = true;
                clearInterval(spawnInterval); // Stop normal items
                
                // Clear existing items
                document.querySelectorAll('.item').forEach(i => i.remove());

                // Spawn The Giant Gold Choco
                const gold = document.createElement('div');
                gold.classList.add('item', 'gold-boss');
                gold.dataset.type = 'gold';
                gold.style.left = "50%"; // Centers it
                container.appendChild(gold);

                // Falls slowly and majestically
                gsap.to(gold, {
                    top: window.innerHeight - 100, // Stops right at basket height
                    duration: 4,
                    ease: "power1.inOut",
                    onUpdate: () => checkCollision(gold)
                });
            }

            // --- GAME OVER ---
            function gameOver() {
                gameActive = false;
                clearInterval(spawnInterval);
                if(bgm) bgm.stop();
                if(sfxDie) sfxDie.play();
                
                // Shake Screen
                gsap.fromTo(container, { x: -20 }, { x: 20, duration: 0.05, repeat: 5, yoyo: true });

                gameOverScreen.style.display = 'flex';
            }

            function triggerWin() {
                gameActive = false;
                if(bgm) bgm.stop();
                if(sfxWin) sfxWin.play();
                confetti({ particleCount: 400, spread: 100 });
                
                winScreen.style.display = 'flex';
            }

            // --- START / RESTART ---
            function startGame() {
                startScreen.style.display = 'none';
                gameOverScreen.style.display = 'none';
                gameActive = true;
                bossPhase = false;
                score = 0;
                scoreEl.innerText = "0";
                
                document.querySelectorAll('.item').forEach(i => i.remove());
                
                if(bgm) bgm.play();
                spawnInterval = setInterval(spawnItem, spawnRate);
            }

            document.getElementById('start-btn').addEventListener('click', startGame);
            document.getElementById('restart-btn').addEventListener('click', startGame);
        });
    </script>
</body>
</html>
