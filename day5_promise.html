<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Promise Day: The Vault</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Kristi&family=Rye&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --primary: #c0392b;
            --success: #2ecc71;
            --metal-light: #b2bec3;
            --metal-dark: #2d3436;
        }

        body {
            margin: 0; padding: 0; overflow: hidden;
            background: #2d3436;
            font-family: 'Share Tech Mono', monospace;
            color: #dfe6e9;
            overscroll-behavior: none;
        }

        #vault-container {
            position: relative; width: 100vw; height: 100dvh;
            display: flex; justify-content: center; align-items: center;
            perspective: 1500px;
            background: radial-gradient(circle at center, #2d3436 0%, #000000 100%);
            overflow: hidden;
        }

        /* --- THE VAULT INTERIOR --- */
        #safe-interior {
            position: absolute; width: 90%; max-width: 400px; height: 70vh;
            background: linear-gradient(to bottom, #444, #222);
            border-radius: 20px;
            box-shadow: inset 0 0 50px #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1;
            border: 10px solid #555;
            transition: all 0.3s ease;
        }

        /* --- THE DOOR --- */
        #vault-door {
            position: absolute; 
            width: 92%; max-width: 420px; 
            height: 72vh;
            background: linear-gradient(135deg, #b2bec3 0%, #636e72 50%, #2d3436 100%);
            border-radius: 15px;
            border: 8px solid #95a5a6;
            box-shadow: 
                inset 2px 2px 5px rgba(255,255,255,0.3),
                inset -2px -2px 5px rgba(0,0,0,0.5),
                20px 20px 60px rgba(0,0,0,0.6);
            z-index: 10;
            transform-origin: left center;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 10px;
            box-sizing: border-box;
        }

        /* Rivets */
        #vault-door::after {
            content: ''; position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 2px dashed #555; border-radius: 10px; pointer-events: none;
        }

        /* --- STATUS DISPLAY --- */
        #status-panel {
            background: #000; border: 2px solid #555;
            padding: 8px 15px; border-radius: 5px;
            margin-bottom: 20px; text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            display: flex; align-items: center; gap: 10px;
        }
        #led {
            width: 12px; height: 12px; border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
        }
        #status-text { color: var(--primary); font-size: 1rem; letter-spacing: 2px; }

        /* --- COMBO LOCK --- */
        #lock-container {
            background: #2d3436;
            padding: 10px;
            border-radius: 10px;
            border-top: 2px solid #636e72;
            border-bottom: 4px solid #000;
            display: flex; gap: 5px;
            box-shadow: inset 0 0 20px #000;
            margin-bottom: 20px;
        }

        .wheel-col {
            width: 50px; height: 90px;
            background: linear-gradient(to bottom, #111 0%, #444 50%, #111 100%);
            color: #fff;
            border-radius: 4px; border: 1px solid #555;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            text-align: center; font-size: 1.5rem;
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .wheel-col::-webkit-scrollbar { display: none; }

        .num {
            height: 90px;
            display: flex; align-items: center; justify-content: center;
            scroll-snap-align: start;
        }

        /* --- BUTTONS --- */
        .tech-btn {
            background: linear-gradient(to bottom, #e74c3c, #c0392b);
            color: white; border: none;
            padding: 12px 30px; font-size: 1rem;
            font-family: 'Share Tech Mono'; font-weight: bold;
            border-radius: 5px; cursor: pointer;
            box-shadow: 0 5px 0 #7f8c8d, 0 10px 10px rgba(0,0,0,0.3);
            text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
            transition: transform 0.1s;
            text-transform: uppercase;
        }
        .tech-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #7f8c8d; }

        /* --- HANDLE DECO --- */
        #handle-deco {
            width: 100px; height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle, #b2bec3 30%, #636e72 90%);
            border: 6px solid #2d3436;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            position: relative; margin-bottom: 20px;
        }
        #handle-deco::before { content:''; position: absolute; top: 10%; left: 45%; width: 10%; height: 80%; background: #2d3436; }
        #handle-deco::after { content:''; position: absolute; top: 45%; left: 10%; width: 80%; height: 10%; background: #2d3436; }

        /* --- PAPER INTERIOR --- */
        #contract-paper {
            background: #f1f2f6; width: 85%; max-width: 320px;
            padding: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transform: rotate(-2deg); color: #2d3436;
            text-align: center; font-family: 'Times New Roman', serif;
            opacity: 0; display: none; 
            transition: transform 0.3s;
        }
        
        textarea {
            width: 90%; height: 60px;
            border: 2px dashed #b2bec3;
            padding: 10px; font-family: 'Kristi', cursive; font-size: 1.5rem;
            margin: 10px 0; resize: none; outline: none; background: transparent;
        }

        /* --- CUSTOM NOTIFICATION SYSTEM --- */
        #notification-overlay {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 15px 30px;
            font-family: 'Share Tech Mono';
            z-index: 1000;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            text-align: center;
            width: 80%; max-width: 300px;
        }
        
        /* --- KEYBOARD OPEN FIXES --- */
        /* If screen is short (keyboard open), straighten paper and hide bg borders */
        @media (max-height: 500px) {
            #safe-interior { border: none; background: transparent; box-shadow: none; }
            #contract-paper { transform: rotate(0deg); } /* Straighten it */
            #vault-door { display: none !important; } /* Double ensure door is gone */
        }
    </style>
</head>
<body>

    <div id="notification-overlay">SYSTEM MESSAGE</div>

    <div id="vault-container">
        
        <div id="safe-interior">
            <div id="contract-paper">
                <h2 style="font-family:'Rye'; margin:0; color:#c0392b; font-size:1.5rem;">OUR PROMISE</h2>
                <p style="font-size:0.8rem; color:#636e72;">Date: <span id="display-date"></span></p>
                <p style="margin:5px 0;">I, <span style="font-family:'Kristi'; font-size:1.5rem">Mrs. Tanvir</span>, promise:</p>
                
                <textarea id="promise-text" placeholder="Type your promise..."></textarea>
                
                <button class="tech-btn" style="background:linear-gradient(to bottom, #2ecc71, #27ae60); box-shadow:0 5px 0 #1e8449;" onclick="sealPromise()">SEAL & SAVE</button>
            </div>
        </div>

        <div id="vault-door">
            <div id="status-panel">
                <div id="led"></div>
                <span id="status-text">LOCKED</span>
            </div>

            <div id="handle-deco"></div>

            <div style="font-size: 0.8rem; margin-bottom: 5px; color: #b2bec3;">TARGET: 27 - 09 - 24</div>

            <div id="lock-container">
                <div class="wheel-col" id="col-day"></div>
                <div class="wheel-col" id="col-month"></div>
                <div class="wheel-col" id="col-year"></div>
            </div>

            <button class="tech-btn" onclick="checkPassword()">OPEN VAULT</button>
            
            <div style="margin-top:10px; font-size:0.7rem; color:#636e72;">SECURE SYSTEM v2.0</div>
        </div>

    </div>

    <script>
        // --- 1. SETUP ---
        const sfxSpin = new Howl({ src: ['assets/sfx_collect.mp3'], volume: 0.1, rate: 2.0 });
        const sfxError = new Howl({ src: ['assets/sfx_jump.mp3'], rate: 0.5, volume: 1.0 }); 
        const sfxSuccess = new Howl({ src: ['assets/sfx_win.mp3'], volume: 1.0 });

        // Date Setup
        const today = new Date();
        const dateStr = today.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        document.getElementById('display-date').innerText = dateStr;

        // --- 2. WHEELS ---
        function populateWheel(id, max) {
            const el = document.getElementById(id);
            el.innerHTML += `<div class="num" style="height:90px;">-</div>`; 
            for(let i=1; i<=max; i++) {
                let val = i < 10 ? "0"+i : i;
                el.innerHTML += `<div class="num" data-val="${val}">${val}</div>`;
            }
            el.innerHTML += `<div class="num" style="height:90px;">-</div>`; 
        }

        populateWheel('col-day', 31);
        populateWheel('col-month', 12);
        populateWheel('col-year', 99);

        document.querySelectorAll('.wheel-col').forEach(col => {
            col.addEventListener('scroll', () => {
                if(Math.random() > 0.8) sfxSpin.play();
            });
        });

        // --- 3. NOTIFICATIONS ---
        function showNotification(msg, type) {
            const notif = document.getElementById('notification-overlay');
            notif.innerText = msg;
            
            if(type === 'success') {
                notif.style.borderColor = 'var(--success)';
                notif.style.color = 'var(--success)';
            } else {
                notif.style.borderColor = 'var(--primary)';
                notif.style.color = 'var(--primary)';
            }

            notif.style.opacity = 1;
            setTimeout(() => { notif.style.opacity = 0; }, 2500);
        }

        // --- 4. CHECK LOGIC ---
        function checkPassword() {
            const getVal = (id) => {
                const el = document.getElementById(id);
                const index = Math.round(el.scrollTop / 90); 
                const items = el.querySelectorAll('.num[data-val]');
                if(items[index-1]) return items[index-1].getAttribute('data-val');
                return "00";
            };

            const d = getVal('col-day');
            const m = getVal('col-month');
            const y = getVal('col-year');

            // TARGET: 27 - 09 - 24
            if (d === "27" && m === "09" && y === "24") {
                grantAccess();
            } else {
                denyAccess();
            }
        }

        function denyAccess() {
            sfxError.play();
            showNotification("ACCESS DENIED: INCORRECT DATE", "error");

            const led = document.getElementById('led');
            const text = document.getElementById('status-text');
            const door = document.getElementById('vault-door');

            text.innerText = "DENIED";
            led.style.background = "var(--primary)";
            led.style.boxShadow = "0 0 10px var(--primary)";
            
            gsap.to(door, { x: 10, duration: 0.05, yoyo: true, repeat: 5, clearProps:"x" });
            gsap.to(led, { opacity: 0, duration: 0.1, yoyo: true, repeat: 5, clearProps:"opacity" });
        }

        function grantAccess() {
            sfxSuccess.play();
            showNotification("BIOMETRIC SCAN CONFIRMED", "success");

            const led = document.getElementById('led');
            const text = document.getElementById('status-text');
            
            text.innerText = "GRANTED";
            text.style.color = "var(--success)";
            led.style.background = "var(--success)";
            led.style.boxShadow = "0 0 15px var(--success)";

            gsap.to('#handle-deco', { rotation: 360, duration: 1, ease: "back.out" });

            setTimeout(() => {
                // FIXED: Swing Door AND Remove it entirely
                gsap.to('#vault-door', { 
                    rotationY: -100, 
                    x: -50, 
                    opacity: 0, 
                    duration: 1.5, 
                    ease: "power2.inOut",
                    onComplete: () => {
                        // This prevents the overlap glitch when typing
                        document.getElementById('vault-door').style.display = 'none';
                    }
                });
                
                const paper = document.getElementById('contract-paper');
                paper.style.display = 'block';
                gsap.to(paper, { opacity: 1, delay: 0.5, duration: 1 });
            }, 800);
        }

        // --- 5. PDF LOGIC ---
        async function sealPromise() {
            const userPromise = document.getElementById('promise-text').value;
            
            if(!userPromise || userPromise.trim() === "") {
                showNotification("ERROR: PROMISE FIELD EMPTY", "error");
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setLineWidth(1);
            doc.rect(10, 10, 190, 277); 
            
            doc.setFont("times", "bold");
            doc.setFontSize(22);
            doc.text("OUR ETERNAL PROMISE", 105, 40, null, null, "center");
            
            doc.setFontSize(12);
            doc.setFont("times", "normal");
            const todayLong = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            doc.text(`Date: ${todayLong}`, 105, 50, null, null, "center");

            doc.setFontSize(14);
            doc.text("I, the undersigned, hereby promise:", 20, 80);
            
            doc.setFont("courier", "italic");
            doc.setTextColor(200, 0, 0); 
            
            const splitText = doc.splitTextToSize(userPromise, 170);
            doc.text(splitText, 20, 95);
            
            doc.setTextColor(0, 0, 0);
            doc.setFont("times", "normal");
            let nextY = 95 + (splitText.length * 7) + 20; 
            
            doc.text("In return, I promise to be your shield, your support,", 20, nextY);
            doc.text("and your biggest fan, forever.", 20, nextY + 8);

            let sigY = nextY + 50;
            doc.line(20, sigY, 80, sigY);
            doc.text("Her Signature", 30, sigY + 5);

            doc.line(130, sigY, 190, sigY);
            doc.text("Tanvir's Signature", 140, sigY + 5);

            doc.save("Promise_Contract.pdf");
            
            confetti({ particleCount: 200, spread: 100 });
            
            showNotification("CONTRACT SECURED. SENDING TO SERVER...", "success");
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 4000);
        }
    </script>
</body>
</html>
