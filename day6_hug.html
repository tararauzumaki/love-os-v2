<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hug Day: Distance Hug</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <script src="lib/gsap.min.js"></script>
    <script src="lib/howler.min.js"></script>
    <script src="lib/confetti.browser.min.js"></script>

    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; background: #2d3436; 
            font-family: 'Quicksand', sans-serif; touch-action: none; user-select: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; height: 100dvh; /* Mobile Fix */
        }
        #bg-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('assets/d6_map.png'); background-size: cover; background-position: center; 
            opacity: 0.6; z-index: 1; transition: opacity 1s;
        }
        #heart-wrapper { position: relative; z-index: 10; cursor: pointer; }
        #heart-pin { width: 80px; filter: drop-shadow(0 0 10px rgba(255, 71, 87, 0.6)); transform-origin: bottom center; }
        .ripple {
            position: absolute; top: 50%; left: 50%; width: 100px; height: 100px; border-radius: 50%;
            background: rgba(255, 71, 87, 0.4); transform: translate(-50%, -50%) scale(0); z-index: -1; pointer-events: none;
        }
        .screen-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; /* Fix */
            pointer-events: none; z-index: 20; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 50px;
        }
        #instruction { color: #fff; font-size: 1.2rem; text-shadow: 0 2px 4px rgba(0,0,0,0.8); animation: fadeInOut 2s infinite; }
        @keyframes fadeInOut { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
        #message {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; text-align: center; opacity: 0; z-index: 100; pointer-events: none;
        }
        #message h1 { font-family: 'Dancing Script', cursive; color: #ff4757; font-size: 2.5rem; margin-bottom: 10px; text-shadow: 0 2px 10px rgba(0,0,0,1); }
        #message p { color: white; font-size: 1.2rem; text-shadow: 0 1px 5px rgba(0,0,0,1); }
        #finish-btn {
            margin-top: 20px; background: #ff4757; color: white; border: none;
            padding: 10px 30px; border-radius: 50px; font-size: 1rem;
            pointer-events: auto; cursor: pointer; opacity: 0; touch-action: manipulation;
            font-family: 'Quicksand', bold; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #progress-bar { position: absolute; bottom: 100px; width: 200px; height: 6px; background: rgba(255,255,255,0.2); border-radius: 10px; overflow: hidden; opacity: 0; }
        #fill { width: 0%; height: 100%; background: #ff4757; }
    </style>
</head>
<body>
    <div id="bg-layer"></div>
    <div id="heart-wrapper">
        <div class="ripple"></div> <div class="ripple" style="animation-delay: 0.5s"></div>
        <img id="heart-pin" src="assets/d6_pin_heart.png" alt="Location Heart">
    </div>
    <div class="screen-overlay">
        <div id="progress-bar"><div id="fill"></div></div>
        <div id="instruction">Press & Hold to Feel Me</div>
    </div>
    <div id="message">
        <h1>Sending Hug...</h1>
        <p>No matter the distance,<br>I'm right here.</p>
        <button id="finish-btn" onclick="location.href='index.html'">Received ❤️</button>
    </div>
    <script>
        let sfxHeartbeat, sfxWin;
        try { sfxHeartbeat = new Howl({ src: ['assets/sfx_heartbeat.mp3'], loop: true, volume: 1.0 }); sfxWin = new Howl({ src: ['assets/sfx_win.mp3'], volume: 0.8 }); } catch(e){}
        const heartBtn = document.getElementById('heart-wrapper'); const heartImg = document.getElementById('heart-pin');
        const instruction = document.getElementById('instruction'); const progressBar = document.getElementById('progress-bar');
        const fill = document.getElementById('fill'); const messageDiv = document.getElementById('message');
        const bgLayer = document.getElementById('bg-layer'); const finishBtn = document.getElementById('finish-btn');
        let isHolding = false; let progress = 0; let holdInterval; let pulseTween;

        gsap.to(heartImg, { y: -10, duration: 1.5, yoyo: true, repeat: -1, ease: "sine.inOut" });

        function startHold(e) {
            e.preventDefault(); if(isHolding) return; isHolding = true;
            if(sfxHeartbeat) sfxHeartbeat.play(); if (navigator.vibrate) navigator.vibrate([100, 200]); 
            instruction.style.opacity = 0; progressBar.style.opacity = 1;
            gsap.killTweensOf(heartImg); pulseTween = gsap.to(heartImg, { scale: 1.3, duration: 0.4, yoyo: true, repeat: -1, ease: "power1.inOut" });
            gsap.to(bgLayer, { opacity: 0.2, duration: 2 });
            holdInterval = setInterval(() => {
                progress += 2; fill.style.width = progress + "%";
                if (progress > 30 && progress < 60) instruction.innerText = "Connecting...";
                if (progress >= 100) finishHug();
            }, 50);
        }
        function endHold() {
            if (!isHolding) return; isHolding = false;
            clearInterval(holdInterval); if(sfxHeartbeat) sfxHeartbeat.stop(); if (navigator.vibrate) navigator.vibrate(0);
            if (progress < 100) {
                progress = 0; fill.style.width = "0%"; instruction.style.opacity = 1; instruction.innerText = "Press & Hold to Feel Me"; progressBar.style.opacity = 0;
                if(pulseTween) pulseTween.kill(); gsap.to(heartImg, { scale: 1, duration: 0.5, ease: "elastic.out(1, 0.3)" });
                gsap.to(heartImg, { y: -10, duration: 1.5, yoyo: true, repeat: -1, ease: "sine.inOut" });
                gsap.to(bgLayer, { opacity: 0.6, duration: 1 });
            }
        }
        function finishHug() {
            clearInterval(holdInterval); isHolding = false; if(sfxHeartbeat) sfxHeartbeat.stop(); if(sfxWin) sfxWin.play(); if (navigator.vibrate) navigator.vibrate([50]);
            progressBar.style.display = 'none'; instruction.style.display = 'none'; heartBtn.style.pointerEvents = 'none';
            gsap.to(heartImg, { scale: 10, opacity: 0, duration: 1, ease: "power2.in" });
            gsap.to(messageDiv, { opacity: 1, duration: 1, delay: 0.5 });
            gsap.to(finishBtn, { opacity: 1, delay: 1.5, duration: 0.5 });
            confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 }, colors: ['#ff4757', '#ffffff'] });
        }
        heartBtn.addEventListener('mousedown', startHold); window.addEventListener('mouseup', endHold);
        heartBtn.addEventListener('touchstart', startHold); window.addEventListener('touchend', endHold);
    </script>
</body>
</html>
