<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hug Day: Distance Hug</title>
    
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

    <script src="lib/gsap.min.js"></script>
    <script src="lib/howler.min.js"></script>
    <script src="lib/confetti.browser.min.js"></script>

    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; 
            background: #2d3436; 
            font-family: 'Quicksand', sans-serif; 
            touch-action: none; /* Prevents scroll but can affect buttons if not careful */
            user-select: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* --- BACKGROUND MAP --- */
        #bg-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('assets/d6_map.png'); 
            background-size: cover; background-position: center; 
            opacity: 0.6; 
            z-index: 1;
            transition: opacity 1s;
        }

        /* --- THE HEART PIN --- */
        #heart-wrapper {
            position: relative;
            z-index: 10;
            cursor: pointer;
        }

        #heart-pin {
            width: 80px; 
            filter: drop-shadow(0 0 10px rgba(255, 71, 87, 0.6));
            transform-origin: bottom center;
        }

        /* Pulse Waves */
        .ripple {
            position: absolute; top: 50%; left: 50%;
            width: 100px; height: 100px;
            border-radius: 50%;
            background: rgba(255, 71, 87, 0.4);
            transform: translate(-50%, -50%) scale(0);
            z-index: -1;
            pointer-events: none;
        }

        /* --- UI OVERLAY --- */
        .screen-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* Allows clicks to pass through */
            z-index: 20;
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            padding-bottom: 50px;
        }

        #instruction {
            color: #fff; font-size: 1.2rem; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            animation: fadeInOut 2s infinite;
        }

        @keyframes fadeInOut { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        /* --- MESSAGE CONTAINER (Fixed Z-Index) --- */
        #message {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; text-align: center;
            opacity: 0;
            /* CRITICAL FIX: High Z-Index ensures it sits above everything */
            z-index: 100; 
            pointer-events: none; /* Let the container be transparent to clicks... */
        }
        
        #message h1 {
            font-family: 'Dancing Script', cursive; color: #ff4757; 
            font-size: 2.5rem; margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,1);
        }

        #message p {
            color: white; font-size: 1.2rem;
            text-shadow: 0 1px 5px rgba(0,0,0,1);
        }
        
        /* --- FINAL BUTTON (Fixed) --- */
        #finish-btn {
            margin-top: 20px;
            background: #ff4757; color: white; border: none;
            padding: 10px 30px; border-radius: 50px; font-size: 1rem;
            
            /* CRITICAL FIX: Force events to work */
            pointer-events: auto; 
            cursor: pointer; 
            opacity: 0;
            touch-action: manipulation; /* Re-enables tap gestures */
            
            font-family: 'Quicksand', bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        #finish-btn:active { transform: scale(0.95); }

        /* Progress Bar */
        #progress-bar {
            position: absolute; bottom: 100px; width: 200px; height: 6px;
            background: rgba(255,255,255,0.2); border-radius: 10px;
            overflow: hidden; opacity: 0;
        }
        #fill { width: 0%; height: 100%; background: #ff4757; }

    </style>
</head>
<body>

    <div id="bg-layer"></div>

    <div id="heart-wrapper">
        <div class="ripple"></div>
        <div class="ripple" style="animation-delay: 0.5s"></div>
        <img id="heart-pin" src="assets/d6_pin_heart.png" alt="Location Heart">
    </div>

    <div class="screen-overlay">
        <div id="progress-bar"><div id="fill"></div></div>
        <div id="instruction">Press & Hold to Feel Me</div>
    </div>

    <div id="message">
        <h1>Sending Hug...</h1>
        <p>No matter the distance,<br>I'm right here.</p>
        
        <button id="finish-btn" onclick="goHome()">Received ❤️</button>
    </div>

    <script>
        // --- 1. ASSETS ---
        let sfxHeartbeat, sfxWin;
        try {
            sfxHeartbeat = new Howl({ 
                src: ['assets/sfx_heartbeat.mp3'], 
                loop: true, 
                volume: 1.0,
                rate: 1.0 
            });
            sfxWin = new Howl({ src: ['assets/sfx_win.mp3'], volume: 0.8 });
        } catch(e) { console.log("Audio issue"); }

        // --- 2. DOM ELEMENTS ---
        const heartBtn = document.getElementById('heart-wrapper');
        const heartImg = document.getElementById('heart-pin');
        const instruction = document.getElementById('instruction');
        const progressBar = document.getElementById('progress-bar');
        const fill = document.getElementById('fill');
        const messageDiv = document.getElementById('message');
        const bgLayer = document.getElementById('bg-layer');
        const finishBtn = document.getElementById('finish-btn');

        // --- 3. LOGIC VARIABLES ---
        let isHolding = false;
        let progress = 0;
        let holdInterval;
        let pulseTween;

        // Idle Float Animation
        gsap.to(heartImg, { 
            y: -10, duration: 1.5, yoyo: true, repeat: -1, ease: "sine.inOut" 
        });

        // --- 4. NAVIGATION FUNCTION ---
        window.goHome = function() {
            console.log("Going home...");
            window.location.href = 'index.html';
        };

        // --- 5. INTERACTION HANDLERS ---
        function startHold(e) {
            e.preventDefault(); // Stop native behavior (scrolling/zoom)
            if(isHolding) return;
            isHolding = true;

            // Play Sound
            if(sfxHeartbeat) sfxHeartbeat.play();
            
            // Vibrate (Android only)
            if (navigator.vibrate) navigator.vibrate([100, 200, 100, 200, 100, 200, 100, 200]); 

            // UI Changes
            instruction.style.opacity = 0;
            progressBar.style.opacity = 1;
            
            // Pulse Heart
            gsap.killTweensOf(heartImg);
            pulseTween = gsap.to(heartImg, { 
                scale: 1.3, duration: 0.4, yoyo: true, repeat: -1, ease: "power1.inOut" 
            });

            // Dim Background
            gsap.to(bgLayer, { opacity: 0.2, duration: 2 });

            // Fill Bar
            holdInterval = setInterval(() => {
                progress += 2; // Speed (approx 2.5 seconds to fill)
                fill.style.width = progress + "%";

                if (progress > 30 && progress < 60) instruction.innerText = "Connecting...";
                
                if (progress >= 100) {
                    finishHug();
                }
            }, 50);
        }

        function endHold() {
            if (!isHolding) return;
            isHolding = false;

            clearInterval(holdInterval);
            if(sfxHeartbeat) sfxHeartbeat.stop();
            if (navigator.vibrate) navigator.vibrate(0);

            // If incomplete, reset
            if (progress < 100) {
                progress = 0;
                fill.style.width = "0%";
                instruction.style.opacity = 1;
                instruction.innerText = "Press & Hold to Feel Me";
                progressBar.style.opacity = 0;
                
                if(pulseTween) pulseTween.kill();
                gsap.to(heartImg, { scale: 1, duration: 0.5, ease: "elastic.out(1, 0.3)" });
                gsap.to(heartImg, { y: -10, duration: 1.5, yoyo: true, repeat: -1, ease: "sine.inOut" });
                gsap.to(bgLayer, { opacity: 0.6, duration: 1 });
            }
        }

        function finishHug() {
            clearInterval(holdInterval);
            isHolding = false;
            if(sfxHeartbeat) sfxHeartbeat.stop();
            if(sfxWin) sfxWin.play();
            if (navigator.vibrate) navigator.vibrate([50, 50, 50]);

            // Hide Game UI
            progressBar.style.display = 'none';
            instruction.style.display = 'none';
            heartBtn.style.pointerEvents = 'none'; // Disable heart interaction

            // Animation: Heart Explodes
            gsap.to(heartImg, { scale: 10, opacity: 0, duration: 1, ease: "power2.in" });
            
            // Show Message
            gsap.to(messageDiv, { opacity: 1, duration: 1, delay: 0.5 });
            gsap.to(finishBtn, { opacity: 1, delay: 1.5, duration: 0.5 });

            // Confetti
            confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 }, colors: ['#ff4757', '#ffffff'] });
        }

        // --- 6. EVENT LISTENERS ---
        heartBtn.addEventListener('mousedown', startHold);
        window.addEventListener('mouseup', endHold);
        
        heartBtn.addEventListener('touchstart', startHold);
        window.addEventListener('touchend', endHold);

    </script>
</body>
</html>
