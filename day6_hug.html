<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hug Day: Sending Love...</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; 
            background: #2d3436; 
            font-family: 'Quicksand', sans-serif; 
            touch-action: none; /* Kills double-tap zoom & scroll */
            user-select: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100dvh; /* Mobile viewport fix */
        }

        /* --- RADAR MAP BACKGROUND --- */
        #map-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; z-index: 1;
        }

        #bg-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('assets/d6_map.png'); 
            background-size: cover; background-position: center; 
            opacity: 0.5; filter: grayscale(30%);
            transition: opacity 1s, transform 3s;
        }

        /* The Radar Sweep Effect */
        .radar-sweep {
            position: absolute; top: 50%; left: 50%;
            width: 150vmax; height: 150vmax;
            background: conic-gradient(from 0deg, transparent 0deg, rgba(255, 71, 87, 0.1) 60deg, rgba(255, 71, 87, 0.4) 90deg, transparent 91deg);
            transform: translate(-50%, -50%) rotate(0deg);
            border-radius: 50%;
            animation: radarSpin 4s linear infinite;
            pointer-events: none;
        }

        @keyframes radarSpin { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

        /* --- THE REACTOR HEART --- */
        #heart-reactor {
            position: relative; z-index: 20;
            width: 180px; height: 180px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent; /* No blue box on tap */
        }

        #heart-img {
            width: 100px; 
            filter: drop-shadow(0 0 15px rgba(255, 71, 87, 0.4));
            transform-origin: center center;
            position: relative; z-index: 22;
        }

        /* SVG Circle Progress */
        .progress-ring {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            transform: rotate(-90deg);
            pointer-events: none;
            z-index: 21;
        }
        .progress-ring__circle {
            stroke: #ff4757; stroke-width: 6; fill: transparent;
            stroke-dasharray: 502; stroke-dashoffset: 502; /* 2 * PI * r (r=80) */
            transition: stroke-dashoffset 0.1s linear;
            stroke-linecap: round;
            filter: drop-shadow(0 0 10px #ff4757);
        }

        /* Particles flying IN */
        .particle {
            position: absolute; width: 6px; height: 6px;
            background: #ff6b81; border-radius: 50%;
            pointer-events: none; z-index: 19;
        }

        /* --- TEXT & UI --- */
        #instruction {
            position: absolute; bottom: 15%;
            color: #fff; font-size: clamp(1rem, 4vw, 1.5rem); font-weight: bold;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            pointer-events: none; z-index: 50;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* --- SUCCESS MESSAGE --- */
        #success-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; pointer-events: none; opacity: 0;
            background: rgba(0,0,0,0.4);
        }

        #success-overlay h1 {
            font-family: 'Dancing Script', cursive; color: #ff4757; 
            font-size: clamp(3rem, 10vw, 4rem); margin: 0;
            text-shadow: 0 4px 0 #000;
            transform: scale(0);
        }

        #success-overlay p {
            color: white; font-size: clamp(1rem, 4vw, 1.5rem); margin-top: 10px;
            text-shadow: 0 2px 5px rgba(0,0,0,1);
            opacity: 0; transform: translateY(20px);
        }

        /* Finish Button */
        #finish-btn {
            margin-top: 30px;
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: white; border: 3px solid white;
            padding: 15px 40px; border-radius: 50px; 
            font-size: 1.2rem; font-weight: bold;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            cursor: pointer; pointer-events: auto;
            opacity: 0; transform: translateY(20px);
            transition: transform 0.1s;
        }
        #finish-btn:active { transform: scale(0.95); }

    </style>
</head>
<body>

    <div id="map-container">
        <div id="bg-layer"></div>
        <div class="radar-sweep"></div>
    </div>

    <div id="heart-reactor">
        <svg class="progress-ring" width="180" height="180">
            <circle class="progress-ring__circle" stroke="white" stroke-width="6" fill="transparent" r="80" cx="90" cy="90"/>
        </svg>
        <img id="heart-img" src="assets/d6_pin_heart.png" alt="Heart">
    </div>

    <div id="instruction">HOLD TO SEND HUG</div>

    <div id="success-overlay">
        <h1>Hug Delivered!</h1>
        <p>You felt that from miles away, right?</p>
        <button id="finish-btn" onclick="goHome()">Mission Complete ❤️</button>
    </div>

    <script>
        // --- 1. SETUP ---
        const circle = document.querySelector('.progress-ring__circle');
        const radius = circle.r.baseVal.value;
        const circumference = radius * 2 * Math.PI;
        
        // Setup SVG dash
        circle.style.strokeDasharray = `${circumference} ${circumference}`;
        circle.style.strokeDashoffset = circumference;

        function setProgress(percent) {
            const offset = circumference - (percent / 100) * circumference;
            circle.style.strokeDashoffset = offset;
        }

        // Audio
        let sfxCharge = new Howl({ src: ['assets/sfx_heartbeat.mp3'], loop: true, rate: 0.5, volume: 0 }); // Start silent
        let sfxBoom = new Howl({ src: ['assets/sfx_win.mp3'], volume: 1.0 });

        // DOM
        const reactor = document.getElementById('heart-reactor');
        const heartImg = document.getElementById('heart-img');
        const instruction = document.getElementById('instruction');
        const bgLayer = document.getElementById('bg-layer');
        const successOverlay = document.getElementById('success-overlay');
        const finishBtn = document.getElementById('finish-btn');
        const container = document.body;

        let isHolding = false;
        let progress = 0;
        let holdInterval;
        let particleInterval;

        // Idle Animation
        gsap.to(heartImg, { scale: 1.1, duration: 0.8, yoyo: true, repeat: -1, ease: "sine.inOut" });

        // --- 2. PARTICLES EFFECT ---
        function spawnParticle() {
            const p = document.createElement('div');
            p.classList.add('particle');
            reactor.appendChild(p);

            // Random start position around circle
            const angle = Math.random() * Math.PI * 2;
            const dist = 100 + Math.random() * 50;
            const x = Math.cos(angle) * dist;
            const y = Math.sin(angle) * dist;

            gsap.set(p, { x: x, y: y, opacity: 1, scale: Math.random() });
            
            // Suck into center
            gsap.to(p, { 
                x: 0, y: 0, opacity: 0, duration: 0.6, ease: "power2.in",
                onComplete: () => p.remove()
            });
        }

        // --- 3. INTERACTION ---
        function startHold(e) {
            if(e.type === 'touchstart') e.preventDefault(); // Stop scroll/zoom
            if(isHolding) return;
            isHolding = true;

            sfxCharge.play();
            sfxCharge.fade(0, 1, 0.5); // Fade in sound
            sfxCharge.rate(0.8); // Start slow

            // Visuals
            instruction.innerText = "CHARGING...";
            instruction.style.color = "#ff6b81";
            
            // Shake effect
            gsap.to(reactor, { x: 2, y: 2, duration: 0.05, repeat: -1, yoyo: true });
            // Shrink background (Focus effect)
            gsap.to(bgLayer, { scale: 1.2, opacity: 0.2, duration: 2 });

            holdInterval = setInterval(() => {
                progress += 1.5; // Fill speed
                setProgress(progress);

                // Ramp up intensity
                if(progress > 0) {
                   // Pitch up sound
                   sfxCharge.rate(0.8 + (progress/200)); 
                   // More particles
                   if(Math.random() > 0.5) spawnParticle();
                }

                if (navigator.vibrate) navigator.vibrate(20); // Haptic feedback

                if (progress >= 100) {
                    finishHug();
                }
            }, 30);
        }

        function endHold() {
            if (!isHolding) return;
            isHolding = false;
            clearInterval(holdInterval);
            
            sfxCharge.fade(1, 0, 0.2);
            setTimeout(() => sfxCharge.stop(), 200);

            // Reset UI if not finished
            if (progress < 100) {
                progress = 0;
                setProgress(0);
                instruction.innerText = "HOLD TO SEND HUG";
                instruction.style.color = "#fff";
                
                gsap.killTweensOf(reactor); // Stop shake
                gsap.to(reactor, { x: 0, y: 0, scale: 1, duration: 0.3 });
                gsap.to(bgLayer, { scale: 1, opacity: 0.5, duration: 0.5 });
            }
        }

        function finishHug() {
            clearInterval(holdInterval);
            isHolding = false; // Stop holding logic
            reactor.style.pointerEvents = 'none'; // Disable click
            
            sfxCharge.stop();
            sfxBoom.play();
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

            // 1. EXPLOSION ANIMATION
            gsap.killTweensOf(reactor);
            gsap.to(reactor, { scale: 0.1, duration: 0.1, ease: "power2.in", onComplete: () => {
                // Expand outward
                gsap.set(heartImg, { opacity: 0 }); // Hide heart
                
                // Shockwave
                const wave = document.createElement('div');
                wave.style.position = 'absolute';
                wave.style.top = '50%'; wave.style.left = '50%';
                wave.style.width = '10px'; wave.style.height = '10px';
                wave.style.background = '#ff4757';
                wave.style.borderRadius = '50%';
                wave.style.zIndex = '99';
                wave.style.transform = 'translate(-50%, -50%)';
                document.body.appendChild(wave);

                gsap.to(wave, { 
                    width: '200vmax', height: '200vmax', opacity: 0, duration: 0.8, ease: "power2.out",
                    onComplete: () => wave.remove()
                });
                
                confetti({ particleCount: 200, spread: 120, colors: ['#ff4757', '#ffffff', '#ff6b81'] });
            }});

            // 2. SHOW SUCCESS SCREEN
            instruction.style.display = 'none';
            successOverlay.style.pointerEvents = 'auto';
            
            gsap.to(successOverlay, { opacity: 1, duration: 0.5 });
            gsap.to('#success-overlay h1', { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.7)", delay: 0.2 });
            gsap.to('#success-overlay p', { opacity: 1, y: 0, duration: 0.5, delay: 0.5 });
            
            // Delay button appearance to prevent accidental double-tap clicks
            gsap.to(finishBtn, { opacity: 1, y: 0, duration: 0.5, delay: 1.5 });
        }

        // --- 4. NAVIGATION ---
        window.goHome = function() {
            window.location.href = 'index.html';
        };

        // --- 5. LISTENERS ---
        // Mouse
        reactor.addEventListener('mousedown', startHold);
        window.addEventListener('mouseup', endHold);
        
        // Touch (with double-tap protection)
        reactor.addEventListener('touchstart', startHold, { passive: false });
        window.addEventListener('touchend', endHold);
        
        // Prevent Context Menu on long press
        window.oncontextmenu = function(event) {
            event.preventDefault();
            event.stopPropagation();
            return false;
        };

    </script>
</body>
</html>
